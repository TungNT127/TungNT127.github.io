name: Inject Cloudflare Analytics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inject-cloudflare-analytics.yml"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inject Cloudflare Web Analytics with owner exclusion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = "<!-- Cloudflare Web Analytics with owner exclusion -->"
          snippet = r'''<!-- Cloudflare Web Analytics with owner exclusion -->
          <script>
          (function () {
              const params = new URLSearchParams(window.location.search);

              function setOwnerFlag(enabled) {
                  try {
                      if (enabled) {
                          localStorage.setItem('portfolio_owner', '1');
                      } else {
                          localStorage.removeItem('portfolio_owner');
                      }
                  } catch (e) {
                      // If localStorage is unavailable, analytics remains enabled.
                  }
              }

              const ownerMode = params.get('owner');

              if (ownerMode === '1') {
                  setOwnerFlag(true);
              } else if (ownerMode === '0') {
                  setOwnerFlag(false);
              }

              if (ownerMode === '1' || ownerMode === '0') {
                  params.delete('owner');
                  const cleanUrl =
                      window.location.pathname +
                      (params.toString() ? '?' + params.toString() : '') +
                      window.location.hash;
                  history.replaceState({}, '', cleanUrl);
              }

              let isOwner = false;
              try {
                  isOwner = localStorage.getItem('portfolio_owner') === '1';
              } catch (e) {
                  isOwner = false;
              }

              if (!isOwner) {
                  const script = document.createElement('script');
                  script.type = 'module';
                  script.src = 'https://static.cloudflareinsights.com/beacon.min.js';
                  script.setAttribute(
                      'data-cf-beacon',
                      '{"token":"1d8cdbee27e8475db34854dc1e843ae1"}'
                  );
                  document.body.appendChild(script);
              }
          })();
          </script>
          <!-- End Cloudflare Web Analytics -->'''

          if marker not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not find </body> in index.html")
              html = html.replace("</body>", snippet + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
              print("Injected Cloudflare analytics.")
          else:
              print("Cloudflare analytics already present; no duplicate inserted.")
          PY

      - name: Commit site update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/inject-cloudflare-analytics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/inject-cloudflare-analytics.yml
          git commit -m "Add Cloudflare analytics with owner exclusion"
          git push
